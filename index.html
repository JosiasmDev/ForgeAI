<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForgeAI</title>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel standalone para transformar JSX en tiempo de ejecución -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Fuentes tipográficas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #080C18;
      color: #f1f5f9;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- Exponer hooks de React de forma global para que el script JSX no falle -->
  <script>
    window.useState = React.useState;
    window.useEffect = React.useEffect;
    window.useRef = React.useRef;
    window.useCallback = React.useCallback;
    window.useMemo = React.useMemo;
    window.useReducer = React.useReducer;
    window.createContext = React.createContext;
    window.useContext = React.useContext;
  </script>

  <!-- Carga del archivo principal de la aplicación -->
  <script type="text/babel" src="./App.jsx"></script>

  <!-- Renderizado del componente principal -->
  <script type="text/babel">
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(
      <StoreProvider>
        <Dashboard />
      </StoreProvider>
    );
  </script>
</body>

</html>
