<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForgeAI</title>

  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel standalone para transformar JSX en tiempo de ejecución -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Fuentes tipográficas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #080C18;
      color: #f1f5f9;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- Exponer React en el ámbito global para Babel -->
  <script>
    window.React = React;
    window.ReactDOM = ReactDOM;
  </script>

  <!-- Carga de App.jsx -->
  <script type="text/babel" data-presets="react" src="./App.jsx"></script>

  <!-- Renderizado cuando el script de App.jsx haya sido procesado por Babel -->
  <script type="text/babel" data-presets="react">
    (function init() {
      function checkAndRender() {
        if (window.StoreProvider && window.Dashboard) {
          const root = ReactDOM.createRoot(document.getElementById('root'));
          root.render(
            <window.StoreProvider>
              <window.Dashboard />
            </window.StoreProvider>
          );
        } else {
          requestAnimationFrame(checkAndRender);
        }
      }
      checkAndRender();
    })();
  </script>
</body>

</html>
