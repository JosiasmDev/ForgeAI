<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForgeAI</title>

  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Fuentes tipográficas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: #080C18; color: #f1f5f9; }
  </style>
  <!-- Anti-Caché dinámico para recarga instantánea de actualizaciones sin borrar historial ni perder sesión -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>

<body>
  <div id="root"></div>

  <script>
    window.React = React;
    window.ReactDOM = ReactDOM;

    // Cargar App.jsx con anti-caché dinámico (?v=timestamp) para actualización instantánea
    fetch('./App.jsx?v=' + Date.now(), { cache: 'no-store' })
      .then(res => res.text())
      .then(code => {
        // Transpilar JSX a JS tradicional usando runtime clásico
        const compiled = Babel.transform(code, {
          presets: [
            ['react', { runtime: 'classic' }]
          ]
        }).code;

        // Ejecutar el código compilado
        const scriptEl = document.createElement('script');
        scriptEl.textContent = compiled;
        document.body.appendChild(scriptEl);

        // Renderizar la aplicación React
        if (window.StoreProvider && window.Dashboard) {
          const root = ReactDOM.createRoot(document.getElementById('root'));
          root.render(
            React.createElement(window.StoreProvider, null,
              React.createElement(window.Dashboard, null)
            )
          );
        } else {
          console.error("No se encontraron StoreProvider o Dashboard");
        }
      })
      .catch(err => {
        console.error("Error al cargar App.jsx:", err);
        document.getElementById('root').innerHTML = `
          <div style="padding: 40px; text-align: center; color: #ef4444;">
            <h2>⚠️ Error de Carga</h2>
            <pre style="margin-top: 10px; color: #94a3b8; font-family: monospace;">${err.message}</pre>
          </div>
        `;
      });
  </script>
</body>

</html>
